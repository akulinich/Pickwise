<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pickwise Matchup Exporter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Pickwise</p>
      <h1>Matchup Exporter</h1>
      <p class="copy">Open a matchup source with the required Legend / Last 3 days filters.</p>
      <div class="source-actions" aria-label="Open matchup source">
        <button class="source-button" id="open-hsguru" type="button">Open HSGuru</button>
        <button class="source-button" id="open-hsreplay" type="button">Open HSReplay</button>
      </div>
      <button class="export-button" id="export" type="button">Export current tab to CSV</button>
      <p id="status" role="status">The CSV stays on this computer.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
